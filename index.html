<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counting</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1 class="title">Counting</h1>

    <div class="setter">
      <input
        id="amount"
        class="setter__input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        aria-label="Amount"
      />
      <div class="setter__actions">
        <button id="set" class="setter__btn" type="button">Set</button>
        <button id="add" class="setter__btn" type="button" hidden aria-label="Add">+</button>
        <button id="subtract" class="setter__btn" type="button" hidden aria-label="Subtract">−</button>
      </div>
    </div>

    <div id="counter" class="counter" aria-live="polite"></div>

    <div class="controls">
      <button id="reset" class="control control--reset" type="button">Reset</button>
    </div>

    <div class="settings">
      <label class="settings__field">
        Digits
        <select id="digits" class="settings__select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </label>

      <label class="settings__field">
        <input id="negative" class="settings__checkbox" type="checkbox" />
        Allow negative
      </label>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
